# Generative-vegetation pipeline (scripts/genveg_pipeline.py; docs/GENVEG_PIPELINE.md) — every switch of every stage lives here.
name: gafl_v3b
data: gafl_v3b                  # data/proto/<data>: v3 architecture on the same table / priors / loss fixes as gafl_v4 (like-for-like comparison)
inputs:                         # FIA databases (read-only; relative to WORKSPACE), fingerprinted into the stage hashes (audit r5 I4)
  curated_db: landis_region4/data_r4/slim_r4_v2.duckdb   # the curation-fix rebuild (FIA_DATA_PREP branch curation-fix); missing until it is built
  fiadb: FIA/FIASQLITE2PGSQL/FIADB.duckdb
stands_run: gafl_pilot          # stand-delineation run (data/derived/runs/<name>, scripts/stands_pipeline.py): forest mask of the candidates + the mapped stands
table:                          # g02b_build_gafl: visits, cohort tokens, footprint candidates + location prior (the long stage)
  NCAND: 256                    # candidate footprints kept per plot (stratified, inclusion-weighted)
  TOPK: 16                      # species keys (top-K, else _S / _H)
  NPROC: 6
  RADIAL_P: 0.9                 # location prior: share of the mass within 0.5 mile (FIA perturbation; audit F7)
train:                          # g03b_train_gafl (the same env is passed to g04 / g05 / g06, which load the model through g03b); NT 1: on the shared 8-core box (campaign + AEF90) 1 torch thread beat 2 and 4 (spin-wait contention)
  seeds: [0, 1]
  model_prefix: m_v3b           # writes <data>/<model_prefix>_s<seed>.pt
  env: {ARCH: v3, EPOCHS: 14, CURRIC: 4, NT: 1, BATCH: 64, DZ: 16, KC: 48, LR: 0.001, LOC: history, PAIR_ANCHOR: both, SEVERITY_ANCHOR: 1,
        W_COMP: 1.0, W_SUM: 1.0, MIN_FSHARE: 0.25, T_PAIR: 0.1, QD_WIN: 1.5,
        SITE_ATTR: 1, PAIR_ALL: 1, PAIR_HMAX: 25, AGE_CH: 1, W_AGE: 1.0, VAL_SPLIT: 1,   # dynamics (audit r3 I1, r4 I4): site attractor, multi-horizon pairs, age clock
        SIGREG_MEAN: 1, JUMP_RESET: 1, STATE_ATTR: 1}   # latent / dynamics fixes (r13; docs/DECISIONS.md G29 uncentred SIGReg, G30 reset-type jumps, G31 state-dependent attractor)
model_seed: 0                   # the trained model used downstream (copied to <data>/model.pt for the tools that read the default)
dynamics:                       # g06_dynamics_check: held-out disturbance-response test of every trained seed
  eval_loc: [history]
  env: {NT: 1, G06_SET: test}
downscale:                      # g04_bayes_downscale: landscape prior A (MDN) + likelihood B + mapping-path calibration
  env: {NT: 1, EPB: 6, MDN_EP: 60, MAP_Y0: 2000}   # MAP_Y0: the REQUESTED mapping start year; g04 gates it (bayes_eval.json map_y0)
map:                            # g05_map_stands: stand vegetation; one output per USE_B (stand_veg_v3_B<b>.parquet); the LAST one is stand_veg_v3.parquet
  use_b: [1, 0]                 # the LAST one is the production map: B0 (prior A only) — the validated path; B1 (stand likelihood) is unvalidated (audit F4)
  env: {NT: 1}
fe:                             # 24_export_fe (stands of stands_run clipped to the area) + g07_fe_attach (GEN_* properties) — writes a file the host FE serves
  area: data/derived/baker_county.gpkg
  geojson: standmap/data/proto/gafl_v3b/baker_fl.geojson     # relative to WORKSPACE (NOT the live FE layer until v4 is reviewed)
  tag: v3b (pipeline)
verify:
  n: 300                        # gv_verify sample size
  n_upstream: 200               # gv_verify_upstream points
