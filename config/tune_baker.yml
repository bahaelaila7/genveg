# Stand-delineation tuning on the Baker County FL pilot window (scripts/stands_tune.py). Variant 0 = the base configuration.
base: config/pilot.yml
stages: [sp, merge, finalize, verify, metrics]
constraints:
  wmedian_ha: [8, 30]          # area-weighted median stand size accepted [ha]
  small_area_pct_max: 2.0      # area share in stands < MMU [%]
grid:
  segmentation.target_median_ha: [10, 15, 25]
  segmentation.shape_weight: [0.0, 0.5, 1.5]
  segmentation.superpixel_ha: [0.5, 1.0]
  segmentation.weights.aef_change: [0.5, 1.5]
random: {n: 12, seed: 1}
# TreeMap's weight is NOT tuned here: its imputation used LANDFIRE EVC / EVT and topography as predictors, so the held-out EVC / terrain layers are not
# independent of it (tuning it against them would be circular).
report_window: [12288, 14336, 16384, 18432]   # Waycross GA pilot: base + top variants re-evaluated here (the ranking is selected on Baker)
report_top: 3
