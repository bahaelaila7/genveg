# Prototype layers for Forest Explorer (scripts/fe_proto_layers.py -> <WORKSPACE>/<out>/{<id>.geojson|png, manifest.json}). Layers whose source does not
# exist yet are skipped (listed in the build log). After a rebuild, restart Forest Explorer on the host (static files are mounted at start).
out: fe_pan/apps/forest-explorer/public/proto
area: data/derived/baker_county.gpkg            # clip polygon of the stand layers
raster_window: [15872, 16384, 17920, 18432]     # rasters: Baker superpixel extent [px]
raster_res_deg: 0.00028                         # ~30 m
layers:
  # ---------------- stand delineation
  - {id: stands_base, group: Stand delineation, kind: stands, run: gafl_pilot, label: "Stands — base configuration (fixed pipeline, 2026-10-22)"}
  - {id: stands_slic_fixed, group: Stand delineation, kind: stands, run: tune_slic__1, label: "Stands — SLIC fixed scaling (tune_slic 1)"}
  - {id: stands_slic_aefonly, group: Stand delineation, kind: stands, run: tune_slic__2, label: "Stands — SLIC on AlphaEarth only (tune_slic 2)"}
  - {id: stands_slic_tmsmooth, group: Stand delineation, kind: stands, run: tune_slic__4, label: "Stands — SLIC with TreeMap smoothed 3x3 (tune_slic 4)"}
  - {id: stands_slic_c015, group: Stand delineation, kind: stands, run: tune_slic__6, label: "Stands — SLIC fixed scaling, compactness 0.15 (best of tune_slic)"}
  - {id: stands_aefraw_c015, group: Stand delineation, kind: stands, run: tune_embed__2, label: "Stands — SLIC on raw AlphaEarth 2022+2025, compactness 0.15 (best of tune_embed)"}
  - {id: stands_latent_c015, group: Stand delineation, kind: stands, run: tune_embed__6, label: "Stands — SLIC on the IWAE latent (12-d), compactness 0.15"}
  - {id: iwae_latent_rgb, group: Stand delineation, kind: latent, model: "run:tune_embed__6/embed/embed.pt", fit: "run:tune_embed__6/fit/feature_fit.npz", label: "IWAE 90 m neighbourhood embedding (12-d) — PCs 1-3 as RGB"}
  - {id: land_status, group: Stand delineation, kind: raster, source: "run:gafl_pilot/clean/land_clean.tif", style: land, label: "Forest-land status (land_clean)"}
  - {id: superpixels, group: Stand delineation, kind: raster, source: "run:gafl_pilot/sp/sp.tif", style: edges, label: "Superpixel edges (SLIC, base)"}
  - {id: aef2025_rgb, group: Stand delineation, kind: raster, source: "data:aef/aef_2025.tif", style: aef_rgb, fit: "run:gafl_pilot/fit/feature_fit.npz", label: "AlphaEarth 2025 — PCs 1-3 as RGB"}
  - {id: aef2022_rgb, group: Stand delineation, kind: raster, source: "data:aef/aef_2022.tif", style: aef_rgb, fit: "run:gafl_pilot/fit/feature_fit.npz", label: "AlphaEarth 2022 — PCs 1-3 as RGB (2025 basis)"}
  # ---------------- held-out evaluation layers (not used by the segmentation)
  - {id: canopy2000, group: Held-out evaluation layers, kind: raster, source: "data:hansen/treecover2000.tif", style: ramp, range: [0, 100], unit: "%", label: "Hansen tree canopy 2000"}
  - {id: evc_tree_cover, group: Held-out evaluation layers, kind: raster, source: "data:derived/tree_cover.tif", style: ramp, range: [0, 100], unit: "%", label: "LANDFIRE EVC 2022 tree cover"}
  - {id: tpi300, group: Held-out evaluation layers, kind: raster, source: "data:terrain/tpi300.tif", style: diverging, range: [-3, 3], unit: "m", label: "LANDFIRE topographic position (300 m)"}
  # ---------------- generative vegetation
  - {id: genveg_pipe, group: Generative vegetation, kind: geojson_file, path: data/proto/gafl_pipe/baker_fl.geojson, label: "Generative vegetation on the new stands (pipeline rebuild 2026-10-22, 45/45 checks)"}
  # ---------------- HBAD3P free runs (plots at the PUBLIC, fuzzed FIA coordinates)
  - {id: hbad3p_freerun_gafl, group: HBAD3P free runs, kind: freerun, fit: landis_hbad3/results/hbad3/fit3p_P3_GAFL, label: "HBAD3P free run, GA+FL val plots (P3_GAFL)"}
  - {id: hbad3p_freerun_app, group: HBAD3P free runs, kind: freerun, fit: landis_hbad3/results/hbad3/fit3p_P3_APP, label: "HBAD3P free run, Appalachian val plots (P3_APP)"}
