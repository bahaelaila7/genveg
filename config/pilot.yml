# Stand delineation pilot — GA + FL. All thresholds live here.
name: gafl_pilot
grid: data/grid/grid.json
window: [15963, 16523, 17657, 18058]   # processing window r0 c0 r1 c1 [px] of the windowed stages (sp, finalize, verify, metrics): Baker County FL pilot; null = full extent
forest_land:
  recent_loss_from: 2017      # Hansen loss year >= this -> status "harvested" (recent clear-cut / stand-replacing loss)
  treecover2000_min: 25       # % canopy in 2000 for a loss pixel to count as former forest
  shrub_treecover2000_min: 50 # non-TreeMap shrub/herb pixel with >= this canopy in 2000 and no detected loss -> "regenerating"
  exclude_evt_lf: [Agriculture, Developed, Water, Barren, Snow-Ice, Fill-NoData]
  exclude_evt_phys_prefix: [Developed, Agricultural, Open Water, Quarries, Snow-Ice]
  disturbed_evt_name: ["Recently Logged", "Recently Burned", "Recently Disturbed", "Plantation", "Ruderal Forest", "Ruderal Flooded"]
segmentation:
  mmu_ha: 2.0                 # minimum mapping unit
  max_ha: 200                 # segments larger than this are split
  aef_pcs: 16                 # AlphaEarth PCs used in the feature vector
  weights: {aef: 1.0, aef_old: 0.4, aef_change: 0.5, treemap: 0.6, soil: 0.3}   # feature-group weights (each group scaled to total variance weight²)
  status_is_hard: true        # forest / harvested / regenerating never share a stand (also in the MMU absorption of 22 / 23)
  superpixel_ha: 1.0          # SLIC superpixel size (building blocks; smaller than the MMU)
  sp_tile: 512                # superpixel tile size [px] (superpixels never cross tile edges; the RAG merge joins them)
  sp_seam_halo: 16            # seam reconciliation (default 2026-10-22): SLIC on tile + 16-px halo; superpixels cut by a tile seam re-joined when both tiles agree (stitch). Baker: seam_excess 1.76 -> 1.20, share 0.1971 -> 0.1984; 0 = off
  slic_compactness: 0.15      # tune_slic / tune_embed / tune_embed2 (2026-10-22): 0.15 best on both windows (0.3 unstable with raw AlphaEarth)
  slic_scale: tile            # tile = scikit-image's own min-max rescale per tile (its effective compactness then follows each tile's most extreme
                              # feature value, in practice the AEF-change outliers); fixed = compactness rescaled per tile so features / space weigh the
                              # same everywhere: as if every tile spanned slic_range
  slic_range: 5.0             # reference feature range for slic_scale: fixed (the measured tile ranges are 3.8-5.5)
  slic_groups: [aef25_raw, aef22_raw]   # feature groups SLIC sees. Raw AlphaEarth 2022 + 2025 (user suggestion, 2026-10-22): mean share Baker 0.197 /
                              # Waycross 0.194 vs the 34-channel stack 0.173 / 0.169; IWAE 12-d latent (c 0.08) 0.194 / 0.191; see docs/STANDS_PIPELINE.md
  merge_groups: [aef, aef_old, aef_change, treemap, soil]  # feature space of the Ward merge (and stand_feat); groups as slic_groups
                              # groups: aef aef_old aef_change treemap soil (the scaled stack), aef25_raw aef22_raw (raw AlphaEarth embeddings, unit norm),
                              # latent (the embed stage's IWAE posterior mean)
  treemap_smooth_px: 0        # > 0: masked mean of the TreeMap channels over n x n px for SLIC only (TreeMap imputes a plot per pixel: salt-and-pepper)
  merge_method: ward          # ward (mutual-best Ward merges, threshold below) | graph_slic (hierarchical SLIC level 2 on the superpixel graph: section graph_slic)
  merge_threshold: auto       # Ward threshold; auto = calibrate to target_median_ha
  target_median_ha: 15        # area-weighted median stand size the auto threshold aims for
  shape_weight: 0.5           # preference for merging along long shared boundaries (compact stands)
  barriers: [roads, water, parcels]
merge:
  calib_components: 300       # auto threshold: graph components sampled for the bisection (those > 4 x target_median_ha; all if none)
  calib_iters: 14
embed:                        # stage embed (20b_embed.py): IWAE of 3 x 3 px (90 m) neighbourhoods -> latent for slic_groups / merge_groups [latent]
  enabled: false
  latent_dim: 12
  hidden: 128
  k_iw: 8                     # importance samples of the IWAE bound
  patches: 300000             # training neighbourhoods (10 % held out)
  tiles: 120                  # random 1024-px tiles with >= 20 % forest land
  epochs: 10
  batch: 512
  lr: 0.001
  seed: 1
graph_slic:                   # merge_method graph_slic (scripts/graph_slic.py)
  ha: 8.0                     # seed grid cell [ha] (~ mean stand size before MMU absorption)
  compactness: 1.0            # m: weight of the centroid distance / G against the feature distance / total feature sd
  iters: 10
clean:
  max_dist_px: 15             # a sub-MMU status patch takes the class of the nearest larger forest-land patch within this distance
fit:
  tiles: 60                   # random 1024-px tiles (>= 20 % forest land) sampled for the feature transforms
  px_per_tile: 4000
  seed: 1
finalize:
  hole_dist_px: 3             # barrier / sliver pixels join the nearest stand of the same status within this distance (else any stand)
  mmu_max_passes: 20          # MMU generalisation passes (stops when nothing merges)
  mmu_across_barriers: true   # a fragment < MMU boxed in by barrier lines may join a stand across the line
levels:                       # stage levels (25_levels.py): nested fine units / stands / compartments
  fine_median_ha: 5.0         # area-weighted median of the fine units (inside stands)
  fine_mmu_ha: 0.5
  coarse_median_ha: 50.0      # area-weighted median of the compartments (merged stands)
  coarse_max_ha: 1000.0
  coarse_status_hard: false   # compartments may mix forest / harvested / regenerating stands
  coarse_across_barriers: false   # compartments do not cross road / water / parcel lines
verify:
  attr_sample: 200            # stands whose attributes are recomputed from pixels
metrics:
  headroom_min: 0.05          # layers whose equal-count blocks already reach R² > 1 - this have no headroom: left out of the mean share
  oracle: false               # also compute the oracle ceiling (superpixels merged on the layer itself to the same unit count; slow: base / final runs)
  heldout: [hansen/treecover2000.tif, terrain/elevation.tif, terrain/slope.tif, terrain/tpi300.tif, derived/tree_cover.tif]   # layers NOT used by the segmentation
