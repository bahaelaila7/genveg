# Generative-vegetation pipeline (scripts/genveg_pipeline.py; docs/GENVEG_PIPELINE.md) — every switch of every stage lives here.
name: gafl_v3
data: gafl                      # data/proto/<data>
stands_run: gafl_pilot          # stand-delineation run (data/derived/runs/<name>, scripts/stands_pipeline.py): forest mask of the candidates + the mapped stands
table:                          # g02b_build_gafl: visits, cohort tokens, footprint candidates + location prior (the long stage)
  NCAND: 256                    # candidate footprints kept per plot (stratified, inclusion-weighted)
  TOPK: 16                      # species keys (top-K, else _S / _H)
  NPROC: 6
train:                          # g03b_train_gafl (the same env is passed to g04 / g05 / g06, which load the model through g03b)
  seeds: [0, 1]
  model_prefix: m_final         # writes <data>/<model_prefix>_s<seed>.pt
  env: {EPOCHS: 14, CURRIC: 4, NT: 4, BATCH: 64, DZ: 16, KC: 48, LR: 0.001, LOC: history, PAIR_ANCHOR: both, SEVERITY_ANCHOR: 1,
        W_COMP: 1.0, W_SUM: 1.0, MIN_FSHARE: 0.25}
model_seed: 0                   # the trained model used downstream (copied to <data>/model.pt for the tools that read the default)
dynamics:                       # g06_dynamics_check: held-out disturbance-response test of every trained seed
  eval_loc: [history]
  env: {NT: 7, G06_SET: test}
downscale:                      # g04_bayes_downscale: landscape prior A (MDN) + likelihood B + mapping-path calibration
  env: {NT: 7, EPB: 6, MDN_EP: 60}
map:                            # g05_map_stands: stand vegetation; one output per USE_B (stand_veg_v3_B<b>.parquet); the LAST one is stand_veg_v3.parquet
  use_b: [0, 1]
  env: {NT: 7}
fe:                             # 24_export_fe (stands of stands_run clipped to the area) + g07_fe_attach (GEN_* properties) — writes a file the host FE serves
  area: data/derived/baker_county.gpkg
  geojson: fe_pan/apps/forest-explorer/public/stands/baker_fl.geojson     # relative to WORKSPACE
  tag: v3 (pipeline)
verify:
  n: 300                        # gv_verify sample size
  n_upstream: 200               # gv_verify_upstream points
